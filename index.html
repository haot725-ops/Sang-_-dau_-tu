<script>
const T0=performance.now();
function hideSplash(){const el=document.getElementById("splash");if(!el||el.dataset.h)return;el.dataset.h=1;const w=Math.max(0,1500-(performance.now()-T0));setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),600);},w);}
setTimeout(hideSplash,6000);
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el){if(REDUCED)return;const n=[...el.childNodes].find(x=>x.nodeType===3&&/\d/.test(x.nodeValue));if(!n)return;const t=n.nodeValue,m=/(\d+(?:,\d+)?)/.exec(t);if(!m||/\.\d{3}/.test(t))return;const to=parseFloat(m[1].replace(",",".")),dec=(m[1].split(",")[1]||"").length;if(!(to>0)||to>=1000)return;const a=t.slice(0,m.index),b=t.slice(m.index+m[1].length),t0=performance.now(),D0=750;
  (function f(now){const k=Math.min(1,(now-t0)/D0),e=1-Math.pow(1-k,3);n.nodeValue=k>=1?t:a+nv(to*e,dec)+b;if(k<1)requestAnimationFrame(f);})(t0);}
let IO=null;
function revealList(root){if(REDUCED||!("IntersectionObserver" in window))return;
  if(!IO)IO=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const it=e.target;IO.unobserve(it);it.classList.add("in");setTimeout(()=>{it.classList.remove("rv","in");it.style.transitionDelay="";},900);}),{rootMargin:"0px 0px -6% 0px"});
  root.querySelectorAll('[class~="md:hidden"]>div').forEach((it,i)=>{it.classList.add("rv");it.style.transitionDelay=Math.min(i,9)*40+"ms";IO.observe(it);});}
function playEnter(el){if(!el)return;el.classList.remove("enter");void el.offsetWidth;el.classList.add("enter");clearTimeout(el._en);el._en=setTimeout(()=>el.classList.remove("enter"),1100);el.querySelectorAll(".cnt").forEach(countUp);if(el.id==="view")revealList(el);}
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.tagName==="DETAILS"&&d.open&&d.classList&&d.classList.contains("acc")){d.classList.add("opening");setTimeout(()=>d.classList.remove("opening"),400);}},true);
/* Cảm giác như app: chặn chụm zoom, kéo tải lại, menu giữ lâu */
["gesturestart","gesturechange","gestureend"].forEach(k=>document.addEventListener(k,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1&&!(e.target.closest&&e.target.closest("#chartSvg")))e.preventDefault();},{passive:false});
document.addEventListener("contextmenu",e=>{const t=e.target;if(!(t&&t.closest&&t.closest("input,textarea,select,[contenteditable=true]")))e.preventDefault();});
document.addEventListener("dragstart",e=>e.preventDefault());
"use strict";
/* =================== Tiện ích =================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=d=>new Intl.NumberFormat("vi-VN",{minimumFractionDigits:d,maximumFractionDigits:d});
const nv=(v,d=0)=>(v==null||!isFinite(v))?"—":nf(d).format(v);
const num=(n,d=1)=>nv(n,d);
const vnd=n=>n==null||!isFinite(n)?"—":new Intl.NumberFormat("vi-VN",{maximumFractionDigits:0}).format(Math.round(n));
const signedPct=(n,d=1)=>{if(n==null||!isFinite(n))return"—";const b=nf(d).format(Math.abs(n));return n>0.0001?"+"+b+"%":n<-0.0001?"−"+b+"%":b+"%";};
const fTy=n=>n==null||!isFinite(n)?"—":n>=1000?nv(n/1000,n>=10000?0:1)+" nghìn tỷ":nv(n,0)+" tỷ";
const fTyShort=n=>n==null||!isFinite(n)?"—":n>=100?nv(n,0)+" tỷ":nv(n,1)+" tỷ";
const axisPrice=n=>Math.abs(n)>=1000?nv(n/1000,n>=10000?0:1)+"k":nv(n,0);
const fold=s=>String(s).normalize("NFD").replace(/\p{M}/gu,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().trim();
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true;}catch(e){return false;}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};
function toast(t){const e=$("toast");e.textContent=t;e.classList.remove("opacity-0","translate-y-3");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.add("opacity-0","translate-y-3"),3200);}
const median=a=>{const v=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!v.length)return null;const m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2;};
const dmy=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||"");return m?m[3]+"."+m[2]+"."+m[1]:"—";};
const dm=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||"");return m?m[3]+"."+m[2]:"—";};

/* ---------- Số liệu CafeF: soi bẫy theo ngành, thay đổi theo quý, điểm chất lượng ---------- */
const pn=p=>{const m=/^Q([1-4])-(\d{4})$/.exec(String(p));return m&&+m[2]>=1900&&+m[2]<=2100?(+m[2])*4+(+m[1]):null;};
const pL=p=>{const m=/^Q([1-4])-(\d{4})$/.exec(String(p));return pn(p)!=null?"Q"+m[1]+"/"+m[2]:String(p);};
const ty=v=>v==null?"—":nv(v/1e9,Math.abs(v)<1e11?1:0)+" tỷ";
const pc=x=>x==null?"—":nv(x*100,1)+"%";

/* chuẩn hoá phản hồi thô của CafeF thành dạng giống data/MÃ.json */
function finBuild(sym,raw){
  const o={ticker:sym,sector:finSecOf(sym),unit:"VND",fetched_at:new Date().toISOString(),source:"cafef.vn"};
  for(const k of["bs","is","cf"]){
    const js=raw&&raw[k];if(!js||js.isSuccess!==true||!js.value)throw new Error("CafeF không trả dữ liệu ("+k+")");
    const v=js.value,by=Object.create(null);
    if(!v||typeof v!=="object"||!Array.isArray(v.data)||!Array.isArray(v.templace)||!v.templace.length)throw new Error("CafeF sai schema báo cáo ("+k+")");
    const ing=a=>{if(!Array.isArray(a))throw new Error("CafeF sai schema kỳ ("+k+")");for(const ky of a){
      if(!ky||typeof ky!=="object")throw new Error("CafeF sai schema kỳ ("+k+")");
      const key=String(ky.time||"");if(pn(key)==null)throw new Error("CafeF trả kỳ quý sai định dạng ("+k+")");
      if(!Array.isArray(ky.data))throw new Error("CafeF thiếu chỉ tiêu kỳ "+key);
      const b=by[key]||(by[key]=Object.create(null));
      for(const it of ky.data){if(!it||typeof it!=="object")throw new Error("CafeF trả dòng chỉ tiêu sai schema ("+k+")");
        if(it.value==null)continue;if(typeof it.value!=="number"||!Number.isFinite(it.value))throw new Error("CafeF trả giá trị không hữu hạn ("+k+")");
        const code=String(it.code==null?"":it.code);if(!code)throw new Error("CafeF thiếu mã chỉ tiêu ("+k+")");
        if(Object.prototype.hasOwnProperty.call(b,code)&&b[code]!==it.value)throw new Error("CafeF trả mã chỉ tiêu xung đột tại kỳ "+key+" ("+k+")");b[code]=it.value;
      }
    }};
    if(FEP[k][2])for(const g of v.data){if(!g||typeof g!=="object")throw new Error("CafeF sai schema nhóm ("+k+")");ing(g.data||[]);}else ing(v.data);
    const per=Object.keys(by).sort((a,b)=>pn(a)-pn(b));
    if(!per.length)throw new Error("Không có số liệu theo quý cho mã "+sym);
    const tm=[],flat=(ns,d)=>(Array.isArray(ns)?ns:[]).forEach(n=>{const ch=Array.isArray(n.data)?n.data:[];tm.push({c:String(n.code==null?"":n.code),n:String(n.name||""),lv:d,g:ch.length>0});if(ch.length)flat(ch,d+1);});
    flat(v.templace,0);if(!tm.length)throw new Error("CafeF thiếu danh mục chỉ tiêu ("+k+")");
    const known=new Set(tm.map(x=>x.c)),extra=new Set();
    per.forEach(p=>Object.keys(by[p]).forEach(c=>{if(!known.has(c))extra.add(c);}));
    extra.forEach(c=>tm.push({c,n:"",lv:0,g:false}));
    o[k]={periods:per,items:tm.map(x=>({code:x.c,name:x.n,lv:x.lv,group:x.g,values:per.map(p=>by[p][x.c]!=null?by[p][x.c]:null)})).filter(x=>x.group||x.values.some(q=>q!=null))};
    if(!o[k].items.some(x=>!x.group&&x.values.some(q=>q!=null)))throw new Error("CafeF không có dòng dữ liệu hợp lệ ("+k+")");
  }
  return o;
}
async function finFetchRaw(sym){
  const w=finWorker(),ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),25000);
  try{
    if(w){const r=await fetch(w+(w.includes("?")?"&":"?")+"symbol="+encodeURIComponent(sym),{signal:ctl.signal});if(!r.ok)throw new Error("Worker trả lỗi "+r.status);return await r.json();}
    const out={};
    await Promise.all(["bs","is","cf"].map(async k=>{
      const u=new URL(FEP[k][0]);u.searchParams.set("symbol",sym);u.searchParams.set("pageIndex","1");u.searchParams.set("pageSize","12");u.searchParams.set("reportType",FEP[k][1]);u.searchParams.set("TypeTime","QUY");
      const r=await fetch(u.toString(),{signal:ctl.signal});if(!r.ok)throw new Error("CafeF trả lỗi "+r.status);out[k]=await r.json();}));
    return out;
  }finally{clearTimeout(tm);}
}
function finErr(e){
  const w=!!finWorker();
  if(e&&e.name==="AbortError")return"Quá thời gian chờ, thử lại sau.";
  if(e&&e.name==="TypeError")return w?"Không kết nối được Worker. Kiểm tra lại địa chỉ Worker hoặc mạng.":"Trình duyệt không gọi thẳng được CafeF (bị chặn hoặc mất mạng). Cần cài Worker trung gian.";
  return String((e&&e.message)||e).slice(0,200);
}

function pxOk(p){
  if(!p||typeof p!=="object"||!Array.isArray(p.d)||p.d.length<30||!["o","h","l","c","v"].every(k=>Array.isArray(p[k])&&p[k].length===p.d.length))return false;
  for(let i=0;i<p.d.length;i++){
    const d=p.d[i];if(typeof d!=="string"||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(d)||(i&&d<=p.d[i-1]))return false;
    const dt=new Date(d+"T00:00:00Z");if(!Number.isFinite(dt.getTime())||dt.toISOString().slice(0,10)!==d)return false;
    const [o,h,l,c,v]=[p.o[i],p.h[i],p.l[i],p.c[i],p.v[i]];
    if(![o,h,l,c,v].every(Number.isFinite)||Math.min(o,h,l,c)<=0||v<0||h<Math.max(o,c,l)||l>Math.min(o,c,h))return false;
  }
  return true;
}
function ingestFin(o,keep){
  const f=finNorm(o);if(!f)return false;if(FINS[f.t]&&!incomingWins(finStamp(f.t),o.fetched_at))return false;const kd0=kindOf(f.t,o);if(kd0){f.sector=kd0;f.cache={};}
  const tr=trimRaw(o,f),f2=finNorm(tr);if(!f2)return false;
  const kd=kindOf(f2.t,o);if(kd){f2.sector=kd;f2.cache={};}else{const sv=finSecOv(f2.t);if(sv)f2.sector=sv;else if(f2.sector==="nganhang"||f2.sector==="ck")f2.sector="chung";f2.cache={};}
  f2.at=f.at;FINS[f2.t]=f2;RAW[f2.t]=tr;
  if(keep)(USER[f2.t]=USER[f2.t]||{}).raw=tr;
  return true;
}
function trimRaw(o,f){       /* chỉ giữ những dòng mà app dùng để tính, cho nhẹ bộ nhớ */
  const out={ticker:o.ticker,sector:f.sector,unit:o.unit,fetched_at:o.fetched_at,source:o.source};
  for(const k of["bs","is","cf"]){
    const use=new Set(Object.keys(FS).filter(x=>fsOf(f,x)[0]===k).map(x=>{const it=finItem(f,x);return it?it.c+"|"+it.n:null;}).filter(Boolean));
    out[k]={periods:o[k].periods,items:o[k].items.filter(x=>!x.group&&use.has(String(x.code==null?"":x.code).slice(0,30)+"|"+String(x.name||"").slice(0,200)))};
  }
  return out;
}
function ingestPx(t,p,keep){

  PX[t]={d:p.d.slice(-260),o:p.o.slice(-260),h:p.h.slice(-260),l:p.l.slice(-260),c:p.c.slice(-260),v:p.v.slice(-260),src:String(p.src||""),asof:p.d[p.d.length-1],fetchedAt:String(p.fetched_at||p.fetchedAt||"")};

  return true;
}

async function wkGet(path,ms=25000){

  try{const w=wk();const r=await fetch(w+path,{signal:ctl.signal});const j=await r.json().catch(()=>null);
    if(!r.ok)throw new Error((j&&j.error)||"Worker trả lỗi "+r.status);return j;}

}
async function directPx(t){   /* không có Worker: thử gọi thẳng VNDirect, thường bị chặn CORS */
  const start=new Date(Date.now()-430*864e5).toISOString().slice(0,10);
  const r=await fetch("https://finfo-api.vndirect.com.vn/v4/stock_prices?sort=date&size=280&q="+encodeURIComponent("code:"+t+"~date:gte:"+start));
  if(!r.ok)throw new Error("VNDirect trả lỗi "+r.status);const js=await r.json();
  const rows=(js.data||[]).map(x=>({d:String(x.date||"").slice(0,10),o:Number(x.open),h:Number(x.high),l:Number(x.low),c:Number(x.close),v:(x.nmVolume??x.volume)==null?NaN:Number(x.nmVolume??x.volume)})).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.d)&&[x.o,x.h,x.l,x.c,x.v].every(Number.isFinite)&&Math.min(x.o,x.h,x.l,x.c)>0&&x.v>=0&&x.h>=Math.max(x.o,x.c,x.l)&&x.l<=Math.min(x.o,x.c,x.h)).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const k=rows.length&&Math.max(...rows.map(x=>x.c))<500?1000:1;
  return{d:rows.map(x=>x.d),o:rows.map(x=>x.o*k),h:rows.map(x=>x.h*k),l:rows.map(x=>x.l*k),c:rows.map(x=>x.c*k),v:rows.map(x=>x.v),src:"vndirect",fetched_at:new Date().toISOString()};
}
async function addOne(t,needFin=true,needPx=true){

  if(needFin)try{const raw=wk()?await wkGet("/?symbol="+encodeURIComponent(t)):await finFetchRaw(t);
    const o=finBuild(t,raw);if(META[t])o.sector=finSecOf(t);gotF=ingestFin(o,true);if(!gotF)throw new Error("BCTC sai schema hoặc kỳ cũ hơn");}catch(e){errs.push("Báo cáo: "+finErr(e));}
  if(needPx)try{const p=wk()?await wkGet("/history?symbol="+encodeURIComponent(t)):await directPx(t);if(p&&!p.fetched_at&&!p.fetchedAt)p.fetched_at=new Date().toISOString();gotP=ingestPx(t,p,true);if(!gotP)throw new Error("OHLCV sai cấu trúc hoặc không đủ phiên");}catch(e){errs.push("Giá: "+(e&&e.name==="TypeError"?"bị chặn CORS, cần Worker":((e&&e.message)||e)));}
  if(!gotF&&!gotP)throw new Error(errs.join(" · "));
  if(errs.length)toast(t+": "+errs.join(" · "));
}

function readTech(s){
  const rsiLabel=s.rsi>=70?"Quá mua, lực đã căng":s.rsi<=30?"Quá bán, lực bán đã cạn dần":s.rsi>=60?"Thiên mạnh, chưa quá mua":s.rsi<=40?"Thiên yếu":"Trung tính";
  const macdLabel=s.macdHist>0&&s.macd>s.macdSignal?"MACD trên signal, histogram dương":s.macdHist<0&&s.macd<s.macdSignal?"MACD dưới signal, histogram âm":"MACD đang cắt, động lượng chưa rõ";
  const vr=s.avgVolume>0?s.lastVolume/s.avgVolume:1;
  const volumeLabel=vr>=1.5?"Khối lượng phiên gần nhất đột biến":vr>=1.05?"Khối lượng nhỉnh hơn trung bình 20 phiên":"Thanh khoản trầm hơn trung bình";
  const toRes=(s.resistance-s.price)/s.price*100,toSup=(s.price-s.support)/s.price*100;
  const levelLabel=toRes<1.5?"Giá đang sát đỉnh 20 nến":toSup<1.5?"Giá đang sát đáy 20 nến":"Còn khoảng "+toRes.toFixed(0)+"% lên đỉnh 20 nến, "+toSup.toFixed(0)+"% về đáy";
  let bias="flat",title="Kỹ thuật trung tính",summary="Giá chưa chọn hướng rõ. Nên chờ giá đứng hẳn trên hoặc dưới MA20 trước khi gắn câu chuyện xu hướng.";
  if(s.trend==="up"&&s.rsi<70&&s.macdHist>=0){bias="up";title="Xu hướng tăng còn nguyên";summary="Giá trên MA20, MA20 trên MA50 và động lượng chưa đảo. Đây là nền thuận, miễn là RSI không bước vào vùng quá mua.";}
  else if(s.trend==="up"&&s.rsi>=70){bias="up";title="Tăng nhưng đã nóng";summary="Xu hướng trung hạn vẫn tăng, song RSI quá mua. Đuổi ở vùng này thường mua phần sóng đã đi.";}
  else if(s.trend==="pullback"){bias="up";title="Điều chỉnh trong sóng tăng";summary="Trung hạn còn trên MA50 nhưng ngắn hạn đã thủng MA20. Có thể là nhịp nghỉ, cũng có thể là đoạn đầu của đảo chiều.";}
  else if(s.trend==="down"&&s.rsi>30){bias="down";title="Xu hướng giảm";summary="Giá dưới cả hai đường trung bình và MA20 đã cắt xuống MA50. Chưa có dấu hiệu đảo từ phía kỹ thuật.";}
  else if(s.rsi<=30){bias="down";title="Quá bán";summary="RSI chạm vùng quá bán. Lực bán có thể cạn, nhưng một mình RSI không biến mã đang giảm thành xu hướng tăng.";}
  else if(s.trend==="down"){bias="down";title="Xu hướng giảm";summary="Cấu trúc trung bình động vẫn xấu. Cần giá lấy lại MA20 trước khi nói đến đảo chiều.";}
  return{bias,title,rsiLabel,macdLabel,volumeLabel,levelLabel,summary};
}
function crossRead(verdict,trend,rsi){
  const cheap=verdict==="cheap"||verdict==="soft-cheap",rich=verdict==="rich",rising=trend==="up"||trend==="pullback",hot=rsi>=70,cold=rsi<=35;
  if(verdict==="na")return{title:"Định giá còn mỏng",body:"Chưa đủ mô hình để nói rẻ hay đắt. Biểu đồ chỉ cho biết thời điểm, không thay phần cơ bản."};
  if(cheap&&trend==="up"&&!hot)return{title:"Khớp cả hai cửa",body:"Giá thấp hơn mức hợp lý và xu hướng chưa gãy. Đây là dạng mã quy trình muốn đưa lên bàn, vẫn phải đọc ROE và nợ trước khi kết luận."};
  if(cheap&&hot)return{title:"Rẻ nhưng đã chạy nóng",body:"Định giá còn biên an toàn, song RSI đã cao. Mua lúc này là mua phần câu chuyện đã được giá phản ánh một đoạn."};
  if(cheap&&(trend==="down"||cold))return{title:"Rẻ và đang yếu",body:"Biên an toàn dương trong lúc giá còn dưới trung bình. Có thể là cơ hội hoặc bẫy, xem nợ, ROE và việc giá có lấy lại MA20 hay không."};
  if(rich&&hot)return{title:"Đắt và quá mua",body:"Cả định giá lẫn RSI đều không ủng hộ việc đuổi. Bước tầm soát sẽ loại mã này nếu bạn bật bộ giá trị hoặc quá mua."};
  if(rich&&trend==="down")return{title:"Đắt và đang yếu",body:"Giá vẫn cao hơn mức hợp lý trong khi xu hướng đã xấu. Không có biên an toàn để dựa vào."};
  if(rich&&rising)return{title:"Xu hướng đẹp, giá không rẻ",body:"Kỹ thuật nghiêng tăng nhưng giá đã vượt mức hợp lý. Hợp để theo dõi hơn là mua mới nếu bạn cần biên an toàn."};
  return{title:"Nằm gần vùng hợp lý",body:"Các mô hình không lệch mạnh so với giá. Phần còn lại là chất lượng lợi nhuận và việc kỹ thuật có đồng thuận hay không."};
}

      row("ROIC",p=>{const a=T("lnst",p),b=T("cplai",p),c=sum2(A("vaynh",p),A("vaydh",p));if(a==null)return null;return R(a+(b||0)*.8,(A("vcsh",p)||0)+(c||0));},x=>x==null?"—":nv(x*100,1)+"%","(LNST + lãi vay × 0,8) / (vốn chủ + vay), thuế 20%"),
      row("ROLC",p=>{const e=ebit(p);return R(e,sum2(A("nodh",p),A("vcsh",p)));},x=>x==null?"—":nv(x*100,1)+"%"),row("BEP",p=>R(ebit(p),A("ts",p)),x=>x==null?"—":nv(x*100,1)+"%")]},

  ];

/* =================== Phát hiện báo cáo đổi phạm vi hợp nhất =================== */
function detectBreak(f){
  const per=f.per,n=per.length,res=[];
  for(let i=Math.max(1,n-8);i<n;i++){
    const p=per[i],pp=per[i-1];if(pn(p)-pn(pp)!==1)continue;
    const ts=fv(f,"ts",p),ts0=fv(f,"ts",pp);if(!(ts>0&&ts0>0))continue;
    const dts=ts/ts0-1,down=dts<0,ev=[];let sc=0;
    if(down&&dts<=-.12){ev.push("tổng tài sản giảm "+nv(-dts*100,0)+"%");sc++;}
    else if(!down&&dts>=.25){ev.push("tổng tài sản tăng "+nv(dts*100,0)+"%");sc++;}
    const m=fv(f,"minor",p),m0=fv(f,"minor",pp);
    if(m!=null&&m0>0.01*ts0&&Math.abs(m/m0-1)>=.5&&((m<m0)===down)){ev.push("lợi ích cổ đông thiểu số "+(down?"giảm ":"tăng ")+nv(Math.abs(m/m0-1)*100,0)+"%");sc++;}
    if(down){
      const l=fv(f,"lkpl",p)||0,l0=fv(f,"lkpl",pp)||0;if(l>0.001*ts0&&(l0<=0||l/l0>=3)){ev.push("xuất hiện khoản lãi từ công ty liên kết");sc++;}
      const d=fv(f,"dtlk",p),d0=fv(f,"dtlk",pp);if(d!=null&&d0>0&&d/d0-1>=1&&d-d0>0.02*ts0){ev.push("khoản đầu tư vào công ty liên kết tăng "+nv((d/d0-1)*100,0)+"%");sc++;}
    }
    if(sc>=2||(down&&dts<=-.2&&sc>=1))res.push({p,dir:down?"down":"up",ev,dts,idx:i,distorted:i>=n-7});
  }
  return res.length?res[res.length-1]:null;
}

/* =================== Kết luận phân tích =================== */
function conclude(s,v){
  const it=[],todo=[],q=s.q,b=s.brk,fin=!!s.financial,bank=s.kind==="bank",pc=(x,d=0)=>signedPct(x,d);
  const add=(k,tone,text)=>it.push({k,tone,text});
  const bd=b&&b.distorted;
  /* 1. Sinh lời */
  if(s.roe!=null){
    const hi=bank?18:15,lo=bank?12:10,lvl=s.roe>=hi?"cao":s.roe>=lo?"khá":s.roe>=0?"thấp":"âm";
    add("Sinh lời",s.roe>=lo?"good":s.roe>=0?"ok":"bad","ROE "+nv(s.roe,1)+"%, mức "+lvl+(s.netMargin!=null?(fin?", lợi nhuận ròng bằng "+nv(s.netMargin,0)+"% doanh thu hoạt động":", biên lợi nhuận ròng "+nv(s.netMargin,1)+"%"):"")+".");
  }
  /* 2. Tăng trưởng */
  if(s.revGrowth!=null||s.epsGrowth!=null){
    const r=s.revGrowth,e=s.epsGrowth,rs=r==null?"—":pc(r,0),es=e==null?"—":pc(e,0);
    if(bd){
      let t="Doanh thu hợp nhất "+rs+" và lợi nhuận công ty mẹ "+es+" so với 4 quý trước. Nhưng từ "+pL(b.p)+" báo cáo có dấu hiệu "+(b.dir==="down"?"không còn hợp nhất một phần hoạt động":"hợp nhất thêm hoạt động mới")+" ("+b.ev.join("; ")+"). ";
      if(b.dir==="down"&&r!=null&&r<-5&&e!=null&&e>-8)t+="Doanh thu tụt nhưng lợi nhuận mẹ gần như đi ngang, nghĩa là phần doanh thu không còn đưa vào đóng góp ít cho lợi nhuận của cổ đông công ty mẹ. ";
      t+="Vì vậy mức tăng trưởng doanh thu không phản ánh sức khỏe kinh doanh thật. Nên nhìn lợi nhuận mẹ và biên lợi nhuận, các so sánh cùng kỳ sẽ sạch lại sau khoảng 4 quý. Đây là suy luận từ số liệu, cần đối chiếu thông báo của công ty.";
      add("Tăng trưởng","ok",t);
      todo.push("Đọc thuyết minh báo cáo hợp nhất của "+pL(b.p)+" để biết công ty nào đổi cách ghi nhận.");
    }else{
      const good=(r==null||r>=10)&&(e!=null&&e>=10),bad=(r!=null&&r<0)&&(e!=null&&e<0);
      add("Tăng trưởng",good?"good":bad?"bad":"ok","Doanh thu "+rs+" và lợi nhuận mẹ "+es+" so với 4 quý trước"+(good?", cả hai cùng tăng.":bad?", cả hai cùng giảm.":(r!=null&&e!=null&&r>0&&e<0?", doanh thu tăng nhưng lợi nhuận giảm, biên đang bị ép.":r!=null&&e!=null&&r<0&&e>0?", doanh thu giảm nhưng lợi nhuận tăng, nhờ biên hoặc khoản khác ngoài kinh doanh.":".")));
    }
  }
  const E=s.eq;
  if(E)add("Chất lượng lãi",E.tone,E.label+". "+E.why+(E.score!=null?" Điểm chất lượng "+E.score+"/100.":""));
  /* 3. Sức khỏe tài chính */
  if(!fin&&q){
    const parts=[];if(s.debtEquity!=null)parts.push("nợ/vốn chủ "+nv(s.debtEquity,2));if(q.m.cr!=null)parts.push("thanh toán hiện hành "+nv(q.m.cr,2));
    const red=q.a.c.filter(x=>x.lv==="cao").map(x=>x.t.toLowerCase());
    const tone=q.cao>=2||(q.m.z!=null&&q.m.z<1.1)?"bad":(q.cao===1||(s.debtEquity!=null&&s.debtEquity>1.5))?"ok":"good";
    add("Tài chính",tone,(parts.length?parts.join(", ")+". ":"")+(red.length?"Có "+red.length+" cờ đỏ: "+red.slice(0,3).join("; ")+".":"Không có cờ đỏ trong các phép kiểm tra tự động.")+(q.a.s.z!=null?" Altman Z'' "+nv(q.a.s.z,1)+" ("+q.a.s.zone+").":""));
    if(q.m.cfoln!=null){
      const c=q.m.cfoln;add("Dòng tiền",c>=.8?"good":c>=0?"ok":"bad","Dòng tiền kinh doanh bằng "+nv(c*100,0)+"% lợi nhuận 4 quý"+(c>=.8?", lợi nhuận được chuyển thành tiền tốt.":c>=0?", thấp hơn lợi nhuận, cần xem phải thu và hàng tồn kho.":", âm dù có lãi, lợi nhuận chưa thành tiền."));
      if(c<0.5)todo.push("Xem vì sao dòng tiền kinh doanh thấp so với lợi nhuận (phải thu, hàng tồn kho, đầu tư vào dự án).");
    }
  }else if(bank&&s.ext){
    const X=s.ext,p=[];if(X.cir!=null)p.push("chi phí/thu nhập "+nv(X.cir,0)+"%");if(X.loanGrowth!=null)p.push("tín dụng tăng "+nv(X.loanGrowth,0)+"%");if(X.ldr!=null)p.push("cho vay/tiền gửi KH "+nv(X.ldr,0)+"%");if(X.creditCost!=null)p.push("chi phí dự phòng "+nv(X.creditCost,2)+"% dư nợ");
    add("Hiệu quả và rủi ro",X.cir!=null&&X.cir>55?"bad":X.ldr!=null&&X.ldr>100?"ok":"good",p.join(", ")+"."+(X.ldr!=null&&X.ldr>100?" Cho vay vượt tiền gửi khách hàng (tính trên số thuần), cần để ý nguồn vốn khác.":""));
    todo.push("Nợ xấu và CAR không có trong dữ liệu CafeF, hãy xem báo cáo của ngân hàng.");
  }else if(s.kind==="sec"&&s.ext){
    const X=s.ext,p=[];if(X.lev!=null)p.push("đòn bẩy "+nv(X.lev,2)+" lần");if(X.marginRatio!=null)p.push("cho vay margin bằng "+nv(X.marginRatio,2)+" lần vốn chủ");if(X.propRatio!=null)p.push("tự doanh bằng "+nv(X.propRatio,2)+" lần vốn chủ");
    add("Đòn bẩy",X.lev!=null&&X.lev>3.5?"bad":"ok",p.join(", ")+". Lợi nhuận công ty chứng khoán dao động theo thị trường, chỉ số cao ở nhịp tốt có thể không bền.");
  }
  /* 4. Định giá */
  if(v&&v.fair!=null)add("Định giá",v.verdict==="cheap"||v.verdict==="soft-cheap"?"good":v.verdict==="fair"?"ok":"bad","Giá "+vnd(s.price)+" so với mức hợp lý khoảng "+vnd(v.fair)+" ("+v.verdictLabel.toLowerCase()+", biên an toàn "+signedPct(v.mos,0)+")."+(v.spread!=null&&v.spread>=1.7?" Các mô hình lệch nhau nhiều, dải giá hợp lý rộng.":""));
  else add("Định giá","neutral","Chưa đủ mô hình để định giá "+s.t+".");
  /* 5. Kỹ thuật */
  if(s.trend){const t=readTech(s);add("Kỹ thuật",t.bias==="up"?"good":t.bias==="down"?"bad":"ok",t.title+", RSI "+nv(s.rsi,0)+".");}
  /* Tóm lại */
  const lo=bank?12:10,cheap=v&&(v.verdict==="cheap"||v.verdict==="soft-cheap"),rich=v&&v.verdict==="rich",none=!v||v.fair==null;
  const risk=(q&&(q.cao>=2||q.g==="E"))||(s.roe!=null&&s.roe<0);
  const solid=fin?(s.roe!=null&&s.roe>=lo):(q&&q.tot!=null&&q.tot>=65&&q.cao===0);
  let tone="ok",head="Trung tính",why="Chưa có tín hiệu nổi bật ở cả chất lượng, giá lẫn xu hướng.";
  if(risk){tone="bad";head="Cần thận trọng";why="Báo cáo có điểm yếu đáng kể"+(q&&q.cao>=2?" ("+q.cao+" cờ đỏ)":"")+", giá thấp chưa chắc là cơ hội mà có thể là bẫy giá trị.";}
  else if(none){tone="neutral";head="Chưa đủ dữ liệu";why="Thiếu báo cáo hoặc giá nên chưa kết luận được. Xem các mục bên dưới.";}
  else if(solid&&cheap&&s.trend!=="down"){tone="good";head="Đáng đưa vào danh sách theo dõi mua";why="Chất lượng báo cáo tốt, giá thấp hơn mức hợp lý và xu hướng chưa gãy.";}
  else if(solid&&cheap){tone="ok";head="Nền tảng tốt, giá chưa xác nhận";why="Doanh nghiệp tốt và giá rẻ, nhưng xu hướng giá đang yếu. Chờ giá lấy lại MA20 sẽ an toàn hơn.";}
  else if(solid&&rich){tone="ok";head="Doanh nghiệp tốt, giá đã cao";why="Chất lượng tốt nhưng giá vượt mức hợp lý. Hợp để theo dõi chờ nhịp điều chỉnh hơn là mua mới.";}
  else if(solid){tone="good";head="Doanh nghiệp tốt, giá gần hợp lý";why="Chất lượng tốt và giá không lệch nhiều so với giá trị. Điểm vào phụ thuộc kỹ thuật và khẩu vị rủi ro.";}
  else if(cheap){tone="ok";head="Rẻ nhưng chưa nổi bật về chất lượng";why="Giá thấp hơn mức hợp lý nhưng chất lượng báo cáo chỉ ở mức trung bình, cần xem kỹ nguyên nhân giá thấp.";}
  else if(rich){tone="bad";head="Giá cao, chưa có biên an toàn";why="Giá vượt mức hợp lý trong khi chất lượng chưa vượt trội.";}
  if(E&&E.tone==='bad'&&!risk&&!none){tone="bad";head="Chất lượng lãi đáng ngờ";why=E.why+" Giá thấp chưa chắc là cơ hội.";}
  else if(E&&E.key==="stagn"&&!risk&&!none){tone="ok";head="Đang trì trệ"+(cheap?", giá rẻ có lý do":"");why=E.why+(cheap?" Giá thấp có thể phản ánh đúng việc này.":"");}
  else if(E&&E.key==="decl"&&!risk&&!none){tone="ok";head="Lãi tăng nhưng chất lượng giảm";why=E.why;}
  if(E)E.todo.forEach(t=>todo.push(t));
  if(bd)why+=" Lưu ý: tăng trưởng đang bị méo do báo cáo đổi phạm vi hợp nhất.";
  if(s.shares)todo.push("Số cổ phiếu là ước tính từ vốn góp, đối chiếu với số cổ phiếu lưu hành thực tế nếu cần P/E chính xác.");
  return{tone,head,why,items:it,todo};
}

/* =================== Bóc tách chất lượng lợi nhuận =================== */
function earnQuality(s){
  const f=s.fin;if(!f||s.kind!=="normal")return null;
  const p=f.last,p4=finIdx(f,p,4);if(!p)return null;
  const dis=!!(s.brk&&s.brk.distorted),ab=x=>x==null?null:Math.abs(x);
  const T=(k,pp)=>pp?ttm(f,k,pp):null;
  const Q=pp=>{
    if(!pp)return null;
    const dt=T("dt",pp),lntt=T("lntt",pp);if(dt==null||lntt==null)return null;
    const lnhd=T("lnhd",pp),dttc=T("dttc",pp),cptc=T("cptc",pp),lk=T("lkpl",pp)||0,cb=T("cpbh",pp),ql=T("cpql",pp),lai=T("cplai",pp);
    const fin=(dttc||0)-(cptc||0),core=lnhd!=null?lnhd-fin-lk:null;
    return{dt,lntt,lnst:T("lnst",pp),gop:T("gop",pp),gv:T("gv",pp),lnhd,fin,lk,core,khac:T("lnkhac",pp)||0,
      opex:(cb!=null||ql!=null)?Math.abs(cb||0)+Math.abs(ql||0):null,lai:ab(lai),cfo:T("cfo",pp),capex:ab(T("capex",pp)),dep:ab(T("khauhao",pp))};
  };
  const c=Q(p),o=Q(p4);if(!c||c.dt<=0)return null;
  const sec=[{id:"a",title:"Lãi từ đâu ra",rows:[]},{id:"b",title:"Lãi có thành tiền không",rows:[]},{id:"c",title:"Chất lượng doanh thu",rows:[]},{id:"d",title:"Đang chạy hay trì trệ",rows:[]}];
  const S={a:sec[0].rows,b:sec[1].rows,c:sec[2].rows,d:sec[3].rows};
  const add=(g,k,tone,text,where,yoy)=>{const lech=!!(yoy&&dis),pr=text.split("§");S[g].push({k,tone:lech?"neutral":tone,text:pr[0]+(lech||!pr[1]?"":" "+pr[1].trim())+(lech?" So sánh cùng kỳ đang lệch do báo cáo đổi phạm vi hợp nhất.":""),where:lech?"":where||"",lech});};
  let ep=0,pp=0;const sc=(poss,earn)=>{if(earn==null)return;pp+=poss;ep+=earn;};
  const P=x=>nv(x*100,0)+"%",P1=x=>nv(x*100,1)+"%";
  const A=k=>fv(f,k,p),A4=p4?k=>fv(f,k,p4):()=>null;
  const rev=c.dt,g=o&&o.dt>0?rev/o.dt-1:null;
  /* ---- A. Lãi từ đâu ra ---- */
  let coreShare=null,parts=null,gl=null,gc=null;
  if(c.lntt<=0){add("a","Lỗ","bad","Lợi nhuận trước thuế 4 quý gần nhất là "+ty(c.lntt)+", doanh nghiệp đang lỗ.","Xem nguyên nhân lỗ ở thuyết minh và báo cáo của ban lãnh đạo.");sc(25,0);}
  else if(c.core!=null){
    coreShare=c.core/c.lntt;parts=[{k:"Kinh doanh cốt lõi",v:c.core,cls:"bg-up"},{k:"Tài chính ròng",v:c.fin,cls:"bg-brass"},{k:"Công ty liên kết",v:c.lk,cls:"bg-muted"},{k:"Khác",v:c.khac,cls:"bg-line"}].map(x=>({...x,sh:x.v/c.lntt}));
    const tone=c.core<=0?"bad":coreShare>=.8?"good":coreShare>=.6?"ok":"bad";
    add("a","Cơ cấu lãi",tone,"Trong "+ty(c.lntt)+" lợi nhuận trước thuế 4 quý gần nhất, kinh doanh cốt lõi chiếm "+P(coreShare)+" ("+ty(c.core)+"), tài chính ròng "+ty(c.fin)+", công ty liên kết "+ty(c.lk)+", khác "+ty(c.khac)+"."+(tone==="bad"?" Phần lớn lãi đến từ khoản phụ, thường không lặp lại đều.":""),tone==="good"?"":"Thuyết minh: thu nhập tài chính, lãi liên kết, thu nhập khác.");
    sc(25,c.core<=0?0:coreShare>=.85?25:coreShare>=.7?18:coreShare>=.55?10:3);
    if(o&&o.lntt>0&&o.core>0){
      gl=c.lntt/o.lntt-1;gc=c.core/o.core-1;
      if(gl>.1&&gc<gl-.15)add("a","Lãi cốt lõi","bad","Lợi nhuận trước thuế "+signedPct(gl*100,0)+" nhưng lãi cốt lõi chỉ "+signedPct(gc*100,0)+".§Phần tăng thêm đến từ khoản ngoài kinh doanh chính.","So sánh thu nhập tài chính, lãi liên kết, lợi nhuận khác với năm trước.",true);

  }
  {let neg=0,tot=0;for(let n=0;n<4;n++){const q=finIdx(f,p,n);if(!q)continue;const a=fv(f,"cfo",q),b=fv(f,"lnst",q);if(a==null||b==null)continue;tot++;if(a<0&&b>0)neg++;}
   if(neg>=2)add("b","Theo quý",neg>=3?"bad":"ok",neg+"/"+tot+" quý gần nhất dòng tiền kinh doanh âm dù có lãi.","Xem tính mùa vụ và các khoản thu chậm theo quý.");}
  /* ---- C. Chất lượng doanh thu ---- */

    const ud=x=>[x("tratnh"),x("tratdh"),x("dtchuanh"),x("dtchuadh")].reduce((a,b)=>a+(b||0),0),u=ud(A),u4=ud(A4);

    if(xd!=null&&xd4>0&&xd>xd4*1.5&&avgTS>0&&xd-xd4>.03*avgTS)add("c","Xây dựng dở dang","ok","Xây dựng cơ bản dở dang tăng "+ty(xd-xd4)+" ("+signedPct((xd/xd4-1)*100,0)+"): vốn đã bỏ ra nhưng chưa ra doanh thu.","Thuyết minh các dự án dở dang, tiến độ và thời điểm đưa vào khai thác.",true);
  }

  if(g!=null){

    if(!dis)sc(10,g>=.1?10:g>=.03?7:g>=-.03?3:0);
    const a1=fv(f,"dt",p),a0=fv(f,"dt",p4);
    if(a1!=null&&a0>0&&!dis){const ql=a1/a0-1;
      if(ql<g-.08)add("d","Quý gần nhất","ok","Quý "+pL(p)+" doanh thu "+signedPct(ql*100,0)+" cùng kỳ, thấp hơn nhịp 4 quý ("+signedPct(g*100,0)+"): đà đang chậm lại.","Xem các quý tới và giải trình của ban lãnh đạo.");
      else if(ql>g+.08)add("d","Quý gần nhất","good","Quý "+pL(p)+" doanh thu "+signedPct(ql*100,0)+" cùng kỳ, cao hơn nhịp 4 quý ("+signedPct(g*100,0)+"): đà đang tăng tốc.","");}
  }
  if(o&&o.dt>0&&c.gop!=null&&o.gop!=null){

  if(c.capex!=null&&c.dep>0){

    else if(r>1.5)add("d","Mở rộng",g!=null&&g>=.05?"good":"ok","Chi đầu tư gấp "+nv(r,1)+" lần khấu hao: đang mở rộng."+(g!=null&&g<.05?" Doanh thu chưa theo kịp, cần chờ dự án ra kết quả.":""),"");

    const ts=A("ts"),ts4=A4("ts");
    if(ts>0&&ts4>0&&!dis){const gt=ts/ts4-1;if(gt>.15&&g!=null&&g<gt-.1)add("d","Tài sản","ok","Tổng tài sản "+signedPct(gt*100,0)+" nhưng doanh thu chỉ "+signedPct(g*100,0)+": vốn đang nằm trong tài sản chưa sinh doanh thu.","Xem tài sản nào tăng mạnh nhất (tiền gửi, đầu tư, bất động sản).");}

  let key="mid",label="Chất lượng trung bình",tone="ok",why="Không có điểm xấu nổi bật nhưng cũng chưa có bằng chứng lãi thật mạnh.";

  if([1,2,3].includes(o.step))D.step=o.step;if(typeof o.sel==="string"&&/^[A-Z0-9]{2,10}$/.test(o.sel))D.sel=o.sel;

  if(typeof o.sortKey==="string")D.sortKey=o.sortKey;if(o.sortDir===1||o.sortDir===-1)D.sortDir=o.sortDir;

const WD=["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];
function marketState(){const t=vnNow(),dow=t.getUTCDay(),m=t.getUTCHours()*60+t.getUTCMinutes();
  if(dow===0||dow===6)return["Cuối tuần, thị trường nghỉ",0];if(m<9*60)return["Chưa mở phiên",0];if(m<=11*60+30)return["Đang giao dịch",1];if(m<13*60)return["Nghỉ trưa",0];if(m<=14*60+45)return["Đang giao dịch",1];if(m<=15*60)return["Khớp lệnh đóng cửa",1];return["Đã đóng cửa",0];}
function spark(s,n=30){const b=(s.bars||[]).slice(-n).map(x=>x.close).filter(x=>x>0);if(b.length<5)return'<span class="inline-block h-6 w-16"></span>';
  const lo=Math.min(...b),hi=Math.max(...b),W=64,H=24,r=hi-lo||1,pts=b.map((x,i)=>(i/(b.length-1)*W).toFixed(1)+","+(H-2-(x-lo)/r*(H-4)).toFixed(1)).join(" "),up=b[b.length-1]>=b[0];
  return'<svg viewBox="0 0 '+W+' '+H+'" class="h-6 w-16 shrink-0" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="'+(up?"#0f6a38":"#8e2e28")+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function attention(){
  const out=[],W=new Set(D.watch);
  STOCKS.forEach(s=>{if(!s.price)return;const f=s.fin,E=s.eq,L=[];
    if(f&&s.brk&&pn(f.last)!=null&&pn(s.brk.p)!=null&&pn(f.last)-pn(s.brk.p)<=2)L.push([3,"ok","đổi phạm vi hợp nhất từ "+pL(s.brk.p)+", so sánh cùng kỳ bị lệch"]);
    if(E&&E.key==="loss")L.push([3,"bad","đang lỗ, cần xem lỗ do đâu"]);
    else if(E&&E.key==="noncore")L.push([3,"bad","lãi chủ yếu từ khoản phụ, không phải kinh doanh chính"]);
    else if(E&&(E.key==="decl"||E.key==="stagn"||E.key==="weak"))L.push([2,"ok","chất lượng lãi: "+E.label.toLowerCase()]);
    if(s.changePct!=null&&Math.abs(s.changePct)>=5)L.push([2.2,s.changePct>0?"good":"bad",(s.changePct>0?"tăng ":"giảm ")+nv(Math.abs(s.changePct),1)+"% trong phiên"]);
    if(s.rsi!=null&&s.rsi>=75)L.push([1.5,"ok","RSI "+nv(s.rsi,0)+", vùng quá mua"]);
    if(s.rsi!=null&&s.rsi<=25)L.push([1.5,"ok","RSI "+nv(s.rsi,0)+", vùng quá bán"]);
    if(s.resistance>0&&s.price>=s.resistance*.985&&s.price<=s.resistance*1.01)L.push([1.2,"neutral","sát kháng cự 20 phiên ("+vnd(s.resistance)+")"]);
    if(s.support>0&&s.price<=s.support*1.015&&s.price>=s.support*.99)L.push([1.2,"neutral","sát hỗ trợ 20 phiên ("+vnd(s.support)+")"]);
    if(!L.length)return;L.sort((a,b)=>b[0]-a[0]);const x=L[0];
    out.push({t:s.t,n:s.name,w:x[0]*(W.has(s.t)?1.6:1)+(W.has(s.t)?.5:0),tone:x[1],text:x[2],watch:W.has(s.t)});});
  return out.sort((a,b)=>b.w-a.w).slice(0,6);
}
function cheapGood(){
  const out=[];
  STOCKS.forEach(s=>{if(!s.price||!s.hasFin)return;let v;try{v=val(s);}catch(e){return;}if(!v||v.fair==null||!(v.mos>=15))return;
    const E=s.eq;if(E&&(E.tone==="bad"||E.dis))return;
    if(s.kind==="normal"&&!(s.q&&s.q.tot!=null&&s.q.tot>=60))return;
    out.push({s,v,mos:v.mos,q:s.q&&s.q.tot!=null?s.q.tot:null});});
  return out.sort((a,b)=>b.mos-a.mos).slice(0,5);
}
function sectorHeat(){
  const m=new Map();STOCKS.forEach(s=>{if(s.changePct==null||!s.price)return;const a=m.get(s.sector)||{n:0,sum:0};a.n++;a.sum+=s.changePct;m.set(s.sector,a);});
  return[...m.entries()].map(([k,a])=>({k,n:a.n,avg:a.sum/a.n})).sort((a,b)=>b.avg-a.avg);
}
function heatBg(x){const a=Math.min(1,Math.abs(x)/3)*.55+.08;return x>=0?"rgba(15,106,56,"+a.toFixed(2)+")":"rgba(142,46,40,"+a.toFixed(2)+")";}

  }

  const eq=s.eq,wcRow=k=>R[k];

  const uniq=(L)=>{const seen=new Set(),out=[];L.forEach(x=>{const k=x.text.slice(0,40);if(!seen.has(k)){seen.add(k);out.push(x);}});return out;};

  const W=N.watch,nq=pL(p).replace(/Q(\d)\/(\d+)/,(m,qq,yy)=>qq==="4"?"Q1/"+(+yy+1):"Q"+(+qq+1)+"/"+yy);

function wireChart(){
  const el=$("chartSvg");if(!el)return;
  const P=new Map();let drag=null,pin=null,moved=false;
  const px=e=>{const r=el.getBoundingClientRect(),sc=CH.g.w/(r.width||CH.g.w);return{x:(e.clientX-r.left)*sc,y:(e.clientY-r.top)*sc,sc};};
  const idxAt=x=>CH.g.start+Math.max(0,Math.min(CH.g.N-1,Math.floor((x-CH.g.mg.l)/CH.g.step)));
  const hover=(x,y)=>{CH.hover=idxAt(x);CH.hy=y;paintXh();};
  el.addEventListener("pointerdown",e=>{try{el.setPointerCapture(e.pointerId);}catch(_){}P.set(e.pointerId,{x:e.clientX});moved=false;
    if(P.size===1)drag={x:e.clientX,off:CH.off,tp:e.pointerType};
    else if(P.size===2){const a=[...P.values()];pin={d:Math.abs(a[0].x-a[1].x)||1,nb:chartWin(CH.s.bars).nb};drag=null;moved=true;}});
  el.addEventListener("pointermove",e=>{
    if(!P.has(e.pointerId)){if(e.pointerType==="mouse"){const q=px(e);hover(q.x,q.y);}return;}
    P.set(e.pointerId,{x:e.clientX});
    if(pin&&P.size===2){const a=[...P.values()],d=Math.abs(a[0].x-a[1].x)||1;chartZoomTo(Math.round(pin.nb*pin.d/d),.5);return;}
    if(drag){const q=px(e),dx=(e.clientX-drag.x)*q.sc;if(Math.abs(dx)>5)moved=true;
      if(moved){CH.off=drag.off+Math.round(dx/CH.g.step);CH.hover=null;CH.hy=null;redraw();}
      else if(drag.tp==="mouse")hover(q.x,q.y);}
  });
  const end=e=>{const had=P.has(e.pointerId);P.delete(e.pointerId);if(P.size<2)pin=null;
    if(had&&!moved&&e.pointerType!=="mouse"&&P.size===0){const q=px(e),i=idxAt(q.x);if(CH.hover===i){CH.hover=null;CH.hy=null;}else{CH.hover=i;CH.hy=q.y;}paintXh();}
    if(P.size===0)drag=null;else if(P.size===1){const r=[...P.values()][0];drag={x:r.x,off:CH.off,tp:"touch"};}};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"&&P.size===0){CH.hover=null;CH.hy=null;paintXh();}});
  el.addEventListener("wheel",e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();const q=px(e),g=CH.g;chartZoomTo(Math.round(chartWin(CH.s.bars).nb*(e.deltaY>0?1.15:1/1.15)),Math.max(0,Math.min(1,(q.x-g.mg.l)/(g.step*g.N))));},{passive:false});
}

  if((x=g("[data-vtab]"))){VT.tab=VT.shown===x.dataset.vtab?"":x.dataset.vtab;viewValue();const vp=$("vpanel");playEnter(vp);{const tb=document.querySelector('[data-vtab="'+x.dataset.vtab+'"]');if(tb&&!REDUCED){tb.classList.add("pop");setTimeout(()=>tb.classList.remove("pop"),400);}}if(vp&&vp.getBoundingClientRect().top>innerHeight*.72){const t=$("vtiles");if(t)t.scrollIntoView({behavior:"smooth",block:"start"});}return;}
  if((x=g("[data-vopen]"))){VT.tab=x.dataset.vopen;viewValue();playEnter($("vpanel"));const t=$("vtiles");if(t)t.scrollIntoView({behavior:"smooth",block:"start"});return;}
  if((x=g("[data-zoom]"))){if(!CH.s)return;const Wn=chartWin(CH.s.bars);if(x.dataset.zoom==="reset"){chartReset();redraw();}else chartZoomTo(Math.round(Wn.nb*(x.dataset.zoom==="in"?1/1.4:1.4)),1);return;}
  if((x=g("[data-range]"))){D.range=x.dataset.range;chartReset();saveDesk();if(CH.s)redraw();else viewTech();return;}
  if((x=g("[data-candle]"))){D.candle=x.dataset.candle;D.range=CHART_DEF[D.candle];chartReset();saveDesk();viewTech();return;}
  if((x=g("[data-act]"))){const a=x.dataset.act;
    if(a==="settings")openSheet();else if(a==="closeSheet")closeSheet();
    else if(a==="resetF"){D.F=defaultFilters();saveDesk();viewScreen();}
    else if(a==="dir"){D.sortDir*=-1;saveDesk();renderRes();}
    else if(a==="wkSave"){const v=$("wkUrl").value.trim().replace(/\/+$/,"");if(v&&!/^https:\/\/[^\s]+$/i.test(v)){toast("Địa chỉ phải bắt đầu bằng https://");return;}if(v)lsSet("sang.worker",v);else lsDel("sang.worker");toast(v?"Đã lưu Worker":"Đã xóa Worker");openSheet();}
    else if(a==="liveNow"){toast("Đang lấy giá...");refreshLive(true).then(ok=>toast(ok?"Đã cập nhật giá":"Worker không trả giá, kiểm tra địa chỉ"));}
    else if(a==="addGo"){const L=$("addT").value.split(/[\s,;]+/).filter(Boolean);closeSheet();addMany(L);}
    else if(a==="addVN30"){closeSheet();addMany(VN30);}
    else if(a==="wipe"){lsDel("sang.user");USER={};FINS={};RAW={};PX={};closeSheet();loadFiles().then(()=>{loadUser();rebuild();renderAll();toast("Đã xóa dữ liệu thêm tay");});}
    return;}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("sheet").classList.contains("hidden"))closeSheet();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("tr[data-pick]")){e.preventDefault();D.sel=e.target.dataset.pick;go(2);}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="fq"){D.F.query=t.value;saveDesk();renderRes();}
  else if(t.id==="disc"){$("discV").textContent=t.value+"%";}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f){const n=t.value===""?null:Number(t.value);D.more=true;setF(t.dataset.f,n!=null&&isFinite(n)?n:null);viewScreen();}
  else if(t.dataset&&t.dataset.fb){D.more=true;setF(t.dataset.fb,t.checked);viewScreen();}
  else if(t.id==="sortSel"){D.sortKey=t.value;D.sortDir=t.value==="t"?1:-1;saveDesk();renderRes();}
  else if(t.id==="selT"){selectStock(t.value);}
  else if(t.id==="disc"){D.discount=Number(t.value)/100;saveDesk();viewValue();}
  else if(t.id==="gro"){const n=t.value===""?null:Number(t.value);D.growth=n!=null&&isFinite(n)?n:null;saveDesk();viewValue();}
});
document.addEventListener("toggle",e=>{const t=e.target;if(t.id==="more")D.more=t.open;else if(t.open&&t.querySelector){const r=t.querySelector(".rscroll");if(r)r.scrollLeft=r.scrollWidth;}},true);
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(D.step===3)viewTech();},200);});


/* =================== Cài ra màn hình (tự biến mất sau khi cài) =================== */
(function installBtn(){
  const standalone=()=>matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true;
  if(standalone())return;
  const ua=navigator.userAgent,ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  let ev=null,bar=null;
  const kill=()=>{if(bar){bar.remove();bar=null;}ev=null;};
  const show=()=>{
    if(bar||standalone())return;
    bar=document.createElement("div");bar.id="pwa-install";bar.setAttribute("role","region");bar.setAttribute("aria-label","Cài ứng dụng");
    bar.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#1c1916;color:#f3efe6;display:flex;align-items:center;gap:12px;box-shadow:0 -2px 12px rgba(0,0,0,.25);font-size:14px";
    const msg=ios&&!ev?"Bấm nút Chia sẻ rồi chọn “Thêm vào MH chính” để cài Sàng.":"Cài Sàng ra màn hình để mở nhanh như một ứng dụng.";
    bar.innerHTML='<span style="flex:1;min-width:0;line-height:1.35"></span>'+(ev?'<button type="button" id="pwa-go" style="flex:none;border-radius:8px;background:#f3efe6;color:#1c1916;padding:8px 14px;font-weight:600">Cài đặt</button>':'')+'<button type="button" id="pwa-x" aria-label="Đóng" style="flex:none;padding:6px 8px;color:#f3efe6;opacity:.7;font-size:18px;line-height:1">✕</button>';
    bar.firstChild.textContent=msg;document.body.appendChild(bar);
    const go=bar.querySelector("#pwa-go");
    if(go)go.onclick=async()=>{const e=ev;if(!e)return;go.disabled=true;try{e.prompt();const r=await e.userChoice;if(r&&r.outcome==="accepted")kill();else{go.disabled=false;}}catch(_){go.disabled=false;}};
    bar.querySelector("#pwa-x").onclick=kill;
  };
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();ev=e;if(bar){bar.remove();bar=null;}show();});
  addEventListener("appinstalled",kill);
  try{matchMedia("(display-mode: standalone)").addEventListener("change",x=>{if(x.matches)kill();});}catch(_){}
  if(ios)setTimeout(()=>{if(!ev&&!standalone())show();},2500);
})();

/* =================== Khởi động =================== */
(async function boot(){
  loadDesk();loadUser();
  rebuild();renderAll();
  await loadFiles();rebuild();
  if(D.sel&&!SMAP.has(D.sel))D.sel=null;D.step=0;
  renderAll();hideSplash();playEnter($("view"));if(D.step>1&&D.sel)await selectStock(D.sel,false);refreshLive();
  setInterval(()=>{if(!document.hidden)refreshLive();},20000);
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();

</script>
