<div class="min-h-screen">

<script>
"use strict";
/* =================== Tiện ích =================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=d=>new Intl.NumberFormat("vi-VN",{minimumFractionDigits:d,maximumFractionDigits:d});
const nv=(v,d=0)=>(v==null||!isFinite(v))?"—":nf(d).format(v);
const num=(n,d=1)=>nv(n,d);
const vnd=n=>n==null||!isFinite(n)?"—":new Intl.NumberFormat("vi-VN",{maximumFractionDigits:0}).format(Math.round(n));
const signedPct=(n,d=1)=>{if(n==null||!isFinite(n))return"—";const b=nf(d).format(Math.abs(n));return n>0.0001?"+"+b+"%":n<-0.0001?"−"+b+"%":b+"%";};
const fTy=n=>n==null||!isFinite(n)?"—":n>=1000?nv(n/1000,n>=10000?0:1)+" nghìn tỷ":nv(n,0)+" tỷ";
const fTyShort=n=>n==null||!isFinite(n)?"—":n>=100?nv(n,0)+" tỷ":nv(n,1)+" tỷ";
const axisPrice=n=>Math.abs(n)>=1000?nv(n/1000,n>=10000?0:1)+"k":nv(n,0);
const fold=s=>String(s).normalize("NFD").replace(/\p{M}/gu,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().trim();
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true;}catch(e){return false;}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};
function toast(t){const e=$("toast");e.textContent=t;e.classList.remove("opacity-0","translate-y-3");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.add("opacity-0","translate-y-3"),3200);}
const median=a=>{const v=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!v.length)return null;const m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2;};
const dmy=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||"");return m?m[3]+"."+m[2]+"."+m[1]:"—";};
const dm=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||"");return m?m[3]+"."+m[2]:"—";};

/* ---------- Số liệu CafeF: soi bẫy theo ngành, thay đổi theo quý, điểm chất lượng ---------- */
const pn=p=>{const m=/^Q(\d)-(\d{4})$/.exec(String(p));return m?(+m[2])*4+(+m[1]):null;};
const pL=p=>{const m=/^Q(\d)-(\d{4})$/.exec(String(p));return m?"Q"+m[1]+"/"+m[2]:String(p);};
const ty=v=>v==null?"—":nv(v/1e9,Math.abs(v)<1e11?1:0)+" tỷ";
const pc=x=>x==null?"—":nv(x*100,1)+"%";
/* Chỉ tiêu: [báo cáo, các mã theo TT200, regex tên dự phòng khi mã khác]. Dò mã trước, không thấy mới dò tên. */
const FS={
  tien:["bs",["110"],/tiền và các khoản tương đương tiền/i],dtcnh:["bs",["120"],/đầu tư tài chính ngắn hạn/i],
  phaithu:["bs",["130"],/các khoản phải thu ngắn hạn/i],ton:["bs",["140"],/hàng tồn kho/i],
  tsnh:["bs",["100"],/tài sản ngắn hạn/i],ts:["bs",["270"],/tổng cộng tài sản|tổng tài sản/i],
  nopt:["bs",["300"],/nợ phải trả/i],nonh:["bs",["310"],/nợ ngắn hạn/i],nodh:["bs",["330"],/nợ dài hạn/i],
  vaynh:["bs",["320"],/vay và nợ thuê tài chính ngắn hạn/i],vaydh:["bs",["338"],/vay và nợ thuê tài chính dài hạn/i],
  tratnh:["bs",["312"],/người mua trả tiền trước ngắn hạn/i],tratdh:["bs",["332"],/người mua trả tiền trước dài hạn/i],
  vcsh:["bs",["400"],/vốn chủ sở hữu/i],vongop:["bs",["411"],/vốn góp của chủ sở hữu/i],lnchuapp:["bs",["421"],/lợi nhuận sau thuế chưa phân phối/i],
  dt:["is",["10"],/doanh thu thuần/i],gop:["is",["20"],/lợi nhuận gộp/i],cplai:["is",[],/chi phí lãi vay/i],
  lnkhac:["is",["40"],/lợi nhuận khác/i],lntt:["is",["50"],/tổng lợi nhuận kế toán trước thuế/i],lnst:["is",["60"],/lợi nhuận sau thuế thu nhập doanh nghiệp/i],
  cfo:["cf",["HDKD_20"],/lưu chuyển tiền thuần từ hoạt động kinh doanh/i],capex:["cf",[],/mua sắm.*tài sản cố định|mua sắm, xây dựng/i],cfnet:["cf",[],/lưu chuyển tiền thuần trong kỳ/i]
};
function finNorm(o){
  if(!o||typeof o!=="object"||typeof o.ticker!=="string"||!/^[A-Za-z0-9]{2,10}$/.test(o.ticker))return null;
  const f={t:o.ticker.toUpperCase(),sector:["bds","chung","nganhang","ck"].includes(o.sector)?o.sector:"chung",at:String(o.fetched_at||"").slice(0,10),cache:{}};
  for(const k of["bs","is","cf"]){
    const r=o[k];if(!r||!Array.isArray(r.periods)||!Array.isArray(r.items)||!r.periods.length||r.periods.length>40)return null;
    const per=r.periods.map(String);if(per.some(p=>pn(p)==null))return null;
    const order=per.map((p,i)=>i).sort((a,b)=>pn(per[a])-pn(per[b])),idx={};order.forEach((oi,i)=>{idx[per[oi]]=i;});
    f[k]={per:order.map(i=>per[i]),idx,items:r.items.slice(0,400).filter(x=>x&&typeof x==="object").map(x=>({c:String(x.code==null?"":x.code).slice(0,30),n:String(x.name||"").slice(0,200),lv:Math.min(+x.lv||0,5),g:!!x.group,
      v:order.map(i=>{const q=Array.isArray(x.values)?x.values[i]:null;return typeof q==="number"&&isFinite(q)?q:null;})}))};
  }
  f.per=f.is.per;f.last=f.per[f.per.length-1];f.cfMode=finCfMode(f);return f;
}
function finItem(f,key){
  if(key in f.cache)return f.cache[key];
  const s=fsOf(f,key);let it=null;
  if(s){const r=f[s[0]];it=r.items.find(x=>s[1].includes(x.c)&&!x.g)||r.items.find(x=>!x.g&&s[2].test(x.n.toLowerCase()))||null;}
  return(f.cache[key]=it);
}
function fvRaw(f,key,p){const s=fsOf(f,key),it=finItem(f,key);if(!s||!it)return null;const i=f[s[0]].idx[p];return i==null?null:it.v[i];}
function finCfMode(f){            /* LCTT của CafeF là số đơn quý hay lũy kế từ đầu năm? so với biến động tiền trên bảng cân đối */
  let q=0,y=0;
  f.per.forEach((p,k)=>{const pp=f.per[k-1];if(!pp||pn(p)-pn(pp)!==1||!/^Q[2-4]/.test(p))return;
    const d=fvRaw(f,"tien",p)-fvRaw(f,"tien",pp),n=fvRaw(f,"cfnet",p),n0=fvRaw(f,"cfnet",pp);
    if([d,n,n0].some(x=>x==null||isNaN(x))||n===0||n0===0)return;
    if(Math.abs(d-n)<=Math.abs(d-(n-n0)))q++;else y++;});
  return q+y===0?null:(y>q?"ytd":"q");
}
function finIdx(f,p,n){const k=f.per.indexOf(p)-n;if(!p||k<0)return null;const q=f.per[k];return pn(p)-pn(q)===n?q:null;}
function fv(f,key,p){
  if(!p)return null;
  if(key==="vay"){const a=fv(f,"vaynh",p),b=fv(f,"vaydh",p);return a==null&&b==null?null:(a||0)+(b||0);}
  if(key==="trat"){const a=fv(f,"tratnh",p),b=fv(f,"tratdh",p);return a==null&&b==null?null:(a||0)+(b||0);}
  if(key==="tienall"){const a=fv(f,"tien",p),b=fv(f,"dtcnh",p);return a==null?null:a+(b||0);}
  const cz=x=>x&&fsOf(f,key)[0]==='cf'&&fvRaw(f,'cfo',x)===0;  /* CafeF để 0 ở kỳ thiếu báo cáo lưu chuyển tiền */
  if(cz(p))return null;
  const v=fvRaw(f,key,p);
  if(v!=null&&fsOf(f,key)[0]==="cf"&&f.cfMode==="ytd"&&!/^Q1/.test(p)){const pp=finIdx(f,p,1);if(!pp||cz(pp))return null;const u=fvRaw(f,key,pp);return u==null?null:v-u;}
  return v;
}
function ttm(f,key,p){if(!p)return null;let s=0;for(let n=0;n<4;n++){const q=finIdx(f,p,n);const v=q?fv(f,key,q):null;if(v==null)return null;s+=v;}return s;}
const rt=(a,b)=>a!=null&&b!=null&&b!==0?a/b:null;
/* ---- Kiểm tra bẫy ---- */
function finChecks(f){
  const p=f.last,p1=finIdx(f,p,1),p4=finIdx(f,p,4),R=[];
  const add=(lv,t,d)=>R.push({lv,t,d});
  const A=k=>fv(f,k,p),T=(k,pp)=>pp?ttm(f,k,pp):null;
  /* 1. Dòng tiền so với lợi nhuận */
  const cfoT=T("cfo",p),lnT=T("lnst",p);
  if(cfoT==null||lnT==null)add("na","Dòng tiền so với lợi nhuận","Thiếu dữ liệu lưu chuyển tiền tệ hoặc kết quả kinh doanh");
  else if(lnT>0&&cfoT<0)add("cao","Có lãi nhưng dòng tiền kinh doanh âm","4 quý gần nhất: lợi nhuận sau thuế "+ty(lnT)+", dòng tiền kinh doanh "+ty(cfoT)+". Lãi chưa chuyển thành tiền.");
  else if(lnT>0&&cfoT/lnT<.5)add("tb","Dòng tiền kinh doanh thấp hơn nửa lợi nhuận","4 quý gần nhất: dòng tiền "+ty(cfoT)+" so với lợi nhuận "+ty(lnT)+".");
  else add("ok","Dòng tiền kinh doanh tương xứng lợi nhuận","4 quý gần nhất: dòng tiền "+ty(cfoT)+", lợi nhuận "+ty(lnT)+".");
  /* 2-3. Phải thu, tồn kho tăng nhanh hơn doanh thu */
  const dtT=T("dt",p),dtT4=T("dt",p4),gdt=dtT!=null&&dtT4>0?dtT/dtT4-1:null;
  [["phaithu","Khoản phải thu"],["ton","Hàng tồn kho"]].forEach(([k,l])=>{
    const a=A(k),b=p4?fv(f,k,p4):null,g=a!=null&&b>0?a/b-1:null;
    if(g==null||gdt==null)add("na",l+" so với doanh thu","Cần đủ 8 quý để so cùng kỳ năm trước");
    else if(g>.2&&g-gdt>.5)add("cao",l+" tăng nhanh hơn doanh thu rất nhiều",l+" "+(g>0?"+":"")+nv(g*100,0)+"% so với cùng kỳ, doanh thu 4 quý "+(gdt>0?"+":"")+nv(gdt*100,0)+"%.");
    else if(g>.2&&g-gdt>.25)add("tb",l+" tăng nhanh hơn doanh thu",l+" "+(g>0?"+":"")+nv(g*100,0)+"% so với cùng kỳ, doanh thu 4 quý "+(gdt>0?"+":"")+nv(gdt*100,0)+"%.");
    else add("ok",l+" tăng không vượt doanh thu",l+" "+(g>0?"+":"")+nv(g*100,0)+"%, doanh thu 4 quý "+(gdt>0?"+":"")+nv(gdt*100,0)+"%.");
  });
  /* 4. Thanh khoản ngắn hạn */
  const cov=rt(A("tienall"),A("vaynh"));
  if(cov==null)add("na","Tiền so với nợ vay ngắn hạn","Không thấy dòng vay ngắn hạn (mã 320)");
  else if(cov<.3)add("cao","Tiền chỉ đủ trả "+nv(cov*100,0)+"% nợ vay ngắn hạn","Tiền và đầu tư ngắn hạn "+ty(A("tienall"))+" so với vay ngắn hạn "+ty(A("vaynh"))+". Phải vay đảo nợ hoặc bán tài sản nếu chủ nợ đòi.");
  else if(cov<.7)add("tb","Tiền chỉ đủ trả "+nv(cov*100,0)+"% nợ vay ngắn hạn","Tiền và đầu tư ngắn hạn "+ty(A("tienall"))+" so với vay ngắn hạn "+ty(A("vaynh"))+".");
  else add("ok","Tiền đủ trả "+nv(cov*100,0)+"% nợ vay ngắn hạn","Tiền và đầu tư ngắn hạn "+ty(A("tienall"))+" so với vay ngắn hạn "+ty(A("vaynh"))+".");
  const cr=rt(A("tsnh"),A("nonh"));
  if(cr!=null)add(cr<1?"tb":"ok","Hệ số thanh toán hiện hành "+nv(cr,2),cr<1?"Tài sản ngắn hạn không đủ trả nợ ngắn hạn.":"Tài sản ngắn hạn lớn hơn nợ ngắn hạn.");
  /* 5. Đòn bẩy */
  const dta=rt(A("nopt"),A("ts"));
  if(dta!=null)add(dta>.85?"cao":dta>.7?"tb":"ok","Nợ phải trả chiếm "+nv(dta*100,0)+"% tổng tài sản",dta>.7?"Đòn bẩy cao, lợi nhuận mỏng là dễ bị âm vốn.":"Mức đòn bẩy trong tầm kiểm soát.");
  /* 6. Trả lãi */
  const lttT=T("lntt",p),lai=T("cplai",p);
  if(lttT==null||lai==null||lai<=0)add("na","Khả năng trả lãi vay","Thiếu lợi nhuận trước thuế hoặc chi phí lãi vay (mã 23)");
  else{const cv=(lttT+lai)/lai;add(cv<1?"cao":cv<2?"tb":"ok","Lợi nhuận trước lãi và thuế gấp "+nv(cv,1)+" lần lãi vay",cv<1?"Lợi nhuận không đủ trả lãi vay.":cv<2?"Biên an toàn trả lãi mỏng.":"Trả lãi vay thoải mái.");}
  /* 7. Lợi nhuận bất thường */
  const khacT=T("lnkhac",p);
  if(khacT==null||lttT==null||lttT<=0)add("na","Lợi nhuận từ nguồn khác","Cần có lợi nhuận trước thuế dương để so sánh");
  else{const r=khacT/lttT;add(r>.6?"cao":r>.3?"tb":"ok",r>.3?"Lợi nhuận khác chiếm "+nv(r*100,0)+"% lợi nhuận trước thuế":"Lợi nhuận chủ yếu từ hoạt động chính",r>.3?"Phần lãi này thường không lặp lại (thanh lý, hoàn nhập...).":"Lợi nhuận khác chỉ chiếm "+nv(r*100,0)+"%.");}
  /* 8. Biên gộp */
  const g1=rt(T("gop",p),dtT),g0=rt(T("gop",p4),dtT4);
  if(g1==null||g0==null)add("na","Biên lợi nhuận gộp","Cần đủ 8 quý để so cùng kỳ năm trước");
  else{const d=(g1-g0)*100;add(d<-10?"cao":d<-5?"tb":"ok","Biên gộp 4 quý "+nv(g1*100,1)+"% ("+(d>0?"+":"")+nv(d,1)+" điểm % so với năm trước)",d<-5?"Biên lợi nhuận đang thu hẹp.":"Biên lợi nhuận ổn định hoặc cải thiện.");}
  /* 9. Lỗ, vốn */
  if(lnT!=null&&lnT<0)add("cao","Lỗ trong 4 quý gần nhất","Lợi nhuận sau thuế 4 quý: "+ty(lnT)+".");
  if(A("vcsh")!=null&&A("vcsh")<=0)add("cao","Vốn chủ sở hữu âm","Nợ đã lớn hơn tài sản.");
  /* Riêng bất động sản */
  if(f.sector==="bds"){

  };
  [["dt","Doanh thu thuần",1],["gop","Lợi nhuận gộp",1],["lnst","Lợi nhuận sau thuế",1],["cfo","Dòng tiền kinh doanh",1]].forEach(([k,l,g])=>{

function pxOk(p){return p&&typeof p==="object"&&Array.isArray(p.d)&&p.d.length>=30&&["o","h","l","c","v"].every(k=>Array.isArray(p[k])&&p[k].length===p.d.length)&&p.c.every(x=>typeof x==="number"&&x>0);}
function ingestFin(o,keep){
  const f=finNorm(o);if(!f)return false;const kd0=kindOf(f.t,o);if(kd0){f.sector=kd0;f.cache={};}
  const tr=trimRaw(o,f),f2=finNorm(tr);if(!f2)return false;
  const kd=kindOf(f2.t,o);if(kd){f2.sector=kd;f2.cache={};}else{const sv=finSecOv(f2.t);if(sv)f2.sector=sv;else if(f2.sector==="nganhang"||f2.sector==="ck")f2.sector="chung";f2.cache={};}
  f2.at=f.at;FINS[f2.t]=f2;RAW[f2.t]=tr;
  if(keep)(USER[f2.t]=USER[f2.t]||{}).raw=tr;
  return true;
}
function trimRaw(o,f){       /* chỉ giữ những dòng mà app dùng để tính, cho nhẹ bộ nhớ */
  const out={ticker:o.ticker,sector:f.sector,unit:o.unit,fetched_at:o.fetched_at,source:o.source};
  for(const k of["bs","is","cf"]){
    const use=new Set(Object.keys(FS).filter(x=>fsOf(f,x)[0]===k).map(x=>{const it=finItem(f,x);return it?it.c+"|"+it.n:null;}).filter(Boolean));
    out[k]={periods:o[k].periods,items:o[k].items.filter(x=>!x.group&&use.has(String(x.code==null?"":x.code).slice(0,30)+"|"+String(x.name||"").slice(0,200)))};
  }
  return out;
}
function ingestPx(t,p,keep){
  if(!pxOk(p))return false;
  PX[t]={d:p.d.slice(-260),o:p.o.slice(-260),h:p.h.slice(-260),l:p.l.slice(-260),c:p.c.slice(-260),v:p.v.slice(-260),src:String(p.src||""),asof:p.d[p.d.length-1]};
  if(keep)(USER[t]=USER[t]||{}).px=PX[t];
  return true;
}

function loadUser(){

    for(const t of Object.keys(u).filter(k=>/^[A-Z0-9]{2,10}$/.test(k)).slice(0,120)){
      if(u[t]&&u[t].raw&&ingestFin(u[t].raw,true)){}
      if(u[t]&&u[t].px)ingestPx(t,u[t].px,true);
    }}catch(e){}
}
async function getJson(url){try{const r=await fetch(url,{cache:"no-store"});if(!r.ok)return null;return await r.json();}catch(e){return null;}}
async function pool(list,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,list.length)},async()=>{while(i<list.length){const x=list[i++];try{await fn(x);}catch(e){}}}));}
async function loadFiles(){
  INDEX=await getJson(DATA_BASE+"index.json");STATUS=await getJson(DATA_BASE+"status.json");
  if(!INDEX)return false;
  const ok=a=>(Array.isArray(a)?a:[]).filter(t=>/^[A-Za-z0-9]{2,10}$/.test(t)).map(t=>t.toUpperCase()).slice(0,300);
  await pool(ok(INDEX.tickers),6,async t=>{const o=await getJson(DATA_BASE+t+".json");if(o)ingestFin(o,false);});
  await pool(ok(INDEX.prices),6,async t=>{const p=await getJson(DATA_BASE+"prices/"+t+".json");if(p)ingestPx(t,p,false);});
  return true;
}

/* =================== Worker và nạp theo yêu cầu =================== */
const wk=()=>finWorker();
async function wkGet(path,ms=25000){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms);
  try{const w=wk();const r=await fetch(w+path,{signal:ctl.signal});const j=await r.json().catch(()=>null);
    if(!r.ok)throw new Error((j&&j.error)||"Worker trả lỗi "+r.status);return j;}
  finally{clearTimeout(tm);}
}
async function directPx(t){   /* không có Worker: thử gọi thẳng VNDirect, thường bị chặn CORS */
  const start=new Date(Date.now()-430*864e5).toISOString().slice(0,10);
  const r=await fetch("https://finfo-api.vndirect.com.vn/v4/stock_prices?sort=date&size=280&q="+encodeURIComponent("code:"+t+"~date:gte:"+start));
  if(!r.ok)throw new Error("VNDirect trả lỗi "+r.status);const js=await r.json();
  const rows=(js.data||[]).map(x=>({d:x.date,o:x.open,h:x.high,l:x.low,c:x.close,v:x.nmVolume??x.volume})).filter(x=>x.d&&x.c>0).sort((a,b)=>a.d<b.d?-1:1);
  const k=rows.length&&Math.max(...rows.map(x=>x.c))<500?1000:1;
  return{d:rows.map(x=>x.d),o:rows.map(x=>(x.o||x.c)*k),h:rows.map(x=>(x.h||x.c)*k),l:rows.map(x=>(x.l||x.c)*k),c:rows.map(x=>x.c*k),v:rows.map(x=>x.v||0),src:"vndirect"};
}
async function addOne(t){
  const errs=[];let gotF=false,gotP=false;
  try{const raw=wk()?await wkGet("/?symbol="+encodeURIComponent(t)):await finFetchRaw(t);
    const o=finBuild(t,raw);if(META[t]){o.sector=finSecOf(t);}gotF=ingestFin(o,true);}catch(e){errs.push("Báo cáo: "+finErr(e));}
  try{const p=wk()?await wkGet("/history?symbol="+encodeURIComponent(t)):await directPx(t);gotP=ingestPx(t,p,true);if(!gotP)throw new Error("giá không đủ phiên");}catch(e){errs.push("Giá: "+(e&&e.name==="TypeError"?"bị chặn CORS, cần Worker":((e&&e.message)||e)));}
  if(!gotF&&!gotP)throw new Error(errs.join(" · "));
  if(errs.length)toast(t+": "+errs.join(" · "));
}
let BUSY=false;
async function addMany(arr){
  const L=[...new Set(arr.map(s=>String(s).toUpperCase().trim()).filter(s=>/^[A-Z0-9]{2,10}$/.test(s)))];
  if(!L.length){toast("Mã không hợp lệ");return;}
  if(BUSY){toast("Đang lấy dữ liệu, chờ chút");return;}
  BUSY=true;const bad=[],total=L.length;let n=0;showProg(0,"Đang bắt đầu...");
  const run=async()=>{while(L.length){const t=L.shift();showProg(n/total*100,"Đang lấy "+t+" ("+(n+1)+"/"+total+")...");
    try{await addOne(t);}catch(e){bad.push(t+": "+((e&&e.message)||e));}n++;rebuild();renderAll();}};
  await Promise.all([run(),run()]);
  BUSY=false;hideProg();saveUser();rebuild();renderAll();
  toast(bad.length?("Lỗi "+bad.length+"/"+total+" mã. "+bad[0]).slice(0,170):"Đã thêm "+total+" mã");
}
function showProg(p,t){let e=$("prog");if(!e){e=document.createElement("div");e.id="prog";e.className="fixed inset-x-0 top-0 z-[80] bg-ink px-4 py-2 text-xs text-paper";e.innerHTML='<div class="mx-auto max-w-7xl"><span id="progTx"></span><div class="mt-1 h-1 rounded bg-paper/30"><i id="progBar" class="block h-1 rounded bg-brass-soft" style="width:0"></i></div></div>';document.body.appendChild(e);}
  e.hidden=false;$("progTx").textContent=t;$("progBar").style.width=Math.round(p)+"%";}
function hideProg(){const e=$("prog");if(e)e.hidden=true;}

/* Giá gần thời gian thực qua Worker */
const inMarket=()=>{const d=new Date(Date.now()+7*3600e3),w=d.getUTCDay(),m=d.getUTCHours()*60+d.getUTCMinutes();return w>0&&w<6&&m>=9*60&&m<=15*60;};
async function refreshLive(force){
  if(!wk()||(!force&&!inMarket()))return false;
  const L=STOCKS.map(s=>s.t).slice(0,80);if(!L.length)return false;
  try{const j=await wkGet("/quote?symbols="+L.join(","),15000);
    (j.quotes||[]).forEach(q=>{if(q&&q.t&&q.price>0)LIVE[q.t]={price:q.price,ref:q.ref,changePct:q.changePct,at:j.at||new Date().toISOString()};});
    rebuild();renderAll();return true;}catch(e){return false;}
}

/* =================== Chỉ báo kỹ thuật =================== */
function sma(v,p){const o=Array(v.length).fill(null);let s=0;for(let i=0;i<v.length;i++){s+=v[i];if(i>=p)s-=v[i-p];if(i>=p-1)o[i]=s/p;}return o;}
function ema(v,p,st=0){const o=Array(v.length).fill(null);if(v.length<st+p)return o;const k=2/(p+1);let s=0;for(let i=st;i<st+p;i++)s+=v[i];let pr=s/p;o[st+p-1]=pr;for(let i=st+p;i<v.length;i++){pr=v[i]*k+pr*(1-k);o[i]=pr;}return o;}
function rsiW(c,p=14){const o=Array(c.length).fill(null);if(c.length<=p)return o;let g=0,l=0;for(let i=1;i<=p;i++){const d=c[i]-c[i-1];if(d>=0)g+=d;else l-=d;}let ag=g/p,al=l/p;o[p]=al===0?100:100-100/(1+ag/al);
  for(let i=p+1;i<c.length;i++){const d=c[i]-c[i-1];ag=(ag*(p-1)+Math.max(d,0))/p;al=(al*(p-1)+Math.max(-d,0))/p;o[i]=al===0?100:100-100/(1+ag/al);}return o;}
function indicators(px){
  const c=px.c,n=c.length,m20=sma(c,20),m50=sma(c,50),r=rsiW(c,14),e12=ema(c,12),e26=ema(c,26);
  const macd=c.map((_,i)=>e12[i]!=null&&e26[i]!=null?e12[i]-e26[i]:null);
  const first=macd.findIndex(x=>x!=null);
  const sig=first<0?Array(n).fill(null):ema(macd.map(x=>x==null?0:x),9,first);
  return px.d.map((d,i)=>({date:d,open:px.o[i],high:px.h[i],low:px.l[i],close:c[i],volume:px.v[i],ma20:m20[i],ma50:m50[i],rsi:r[i],macd:macd[i],signal:sig[i],hist:macd[i]!=null&&sig[i]!=null?macd[i]-sig[i]:null}));
}

function crossRead(verdict,trend,rsi){

  if(cheap&&(trend==="down"||cold))return{title:"Rẻ và đang yếu",body:"Biên an toàn dương trong lúc giá còn dưới trung bình. Có thể là cơ hội hoặc bẫy, xem nợ, ROE và việc giá có lấy lại MA20 hay không."};
  if(rich&&hot)return{title:"Đắt và quá mua",body:"Cả định giá lẫn RSI đều không ủng hộ việc đuổi. Bước tầm soát sẽ loại mã này nếu bạn bật bộ giá trị hoặc quá mua."};
  if(rich&&trend==="down")return{title:"Đắt và đang yếu",body:"Giá vẫn cao hơn mức hợp lý trong khi xu hướng đã xấu. Không có biên an toàn để dựa vào."};

  if(typeof o.discount==="number"&&o.discount>=.08&&o.discount<=.16)D.discount=o.discount;
  if(o.growth==null||typeof o.growth==="number")D.growth=o.growth;

  if(Array.isArray(o.watch))D.watch=o.watch.filter(t=>/^[A-Z0-9]{2,10}$/.test(t)).slice(0,100);}}catch(e){}}

function sectorReportBlock(s){

  const metrics=qualityRows(s).filter(r=>names.includes(r.label));
  if(!bank&&X.propRatio!=null)metrics.push({label:"Tài sản FVTPL / vốn chủ",value:nv(X.propRatio,2)+"×",tone:"neutral",tag:"Tham khảo"});
  const tiles=metrics.map(r=>'<div class="rounded-md bg-paper p-3"><div class="text-xs text-muted">'+esc(r.label)+'</div><div class="mt-1 flex items-center justify-between gap-2"><span class="font-mono text-sm">'+esc(r.value)+'</span><span class="rounded px-1.5 py-0.5 text-[10px] font-semibold '+(r.tone==="good"?"bg-up-soft text-up":r.tone==="bad"?"bg-down-soft text-down":r.tone==="ok"?"bg-brass-soft text-brass":"bg-line text-muted")+'">'+esc(r.tag)+'</span></div></div>').join("");
  const netKey=ttm(f,"lnme",p)!=null?"lnme":"lnst",net=ttm(f,netKey,p),netPrev=p4?ttm(f,netKey,p4):null;
  const netLabel=netKey==="lnme"?"LNST thuộc chủ sở hữu":"LNST hợp nhất";
  const growth=(a,b)=>a!=null&&b>0?signedPct((a/b-1)*100,1)+" so với 4 quý trước":"chưa đủ 8 quý hoặc kỳ gốc không dương để so tăng trưởng";
  const summary=bank?netLabel+" 4 quý gần nhất: "+ty(net)+" ("+growth(net,netPrev)+").":
    "Doanh thu hoạt động 4 quý gần nhất: "+ty(ttm(f,"dt",p))+" ("+growth(ttm(f,"dt",p),p4?ttm(f,"dt",p4):null)+"). "+netLabel+": "+ty(net)+" ("+growth(net,netPrev)+").";
  const notes=[];

    else notes.push("Tăng trưởng dư nợ và tiền gửi lần lượt là "+signedPct(X.loanGrowth,1)+" và "+signedPct(X.depGrowth,1)+".");

function chartSvg(s,w){
  const n={"3M":63,"6M":126,"1Y":250}[D.range],B=s.bars.slice(-n),N=B.length,mg={l:6,r:44},iw=w-mg.l-mg.r,step=iw/N,bw=Math.max(1,Math.min(9,step*.65));
  const X=i=>mg.l+step*(i+.5);
  const panel=(top,h,lo,hi,fmt,ticks)=>{const Y=v=>top+h-(v-lo)/((hi-lo)||1)*h;let g='';ticks.forEach(t=>{g+='<line x1="'+mg.l+'" x2="'+(w-mg.r)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'" stroke="#e3dcd0" stroke-width="1"/><text x="'+(w-mg.r+4)+'" y="'+(Y(t)+4).toFixed(1)+'" font-size="10" fill="#5c564c">'+fmt(t)+'</text>';});return{Y,g};};
  const hi=Math.max(...B.map(b=>b.high)),lo=Math.min(...B.map(b=>b.low)),pad=(hi-lo)*.06||hi*.02,P1=panel(8,230,lo-pad,hi+pad,axisPrice,[0,1,2,3,4].map(i=>lo+(hi-lo)*i/4));
  let o='<svg viewBox="0 0 '+w+' 520" width="100%" role="img" aria-label="Biểu đồ nến, khối lượng, RSI và MACD của '+s.t+'" style="display:block">';
  o+=P1.g;
  [[s.resistance,"#8e2e28"],[s.support,"#0f6a38"]].forEach(([v,c])=>{if(v>=lo-pad&&v<=hi+pad)o+='<line x1="'+mg.l+'" x2="'+(w-mg.r)+'" y1="'+P1.Y(v).toFixed(1)+'" y2="'+P1.Y(v).toFixed(1)+'" stroke="'+c+'" stroke-dasharray="4 4" stroke-width="1"/>';});
  B.forEach((b,i)=>{const up=b.close>=b.open,c=up?"#0f6a38":"#8e2e28",x=X(i);o+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+P1.Y(b.high).toFixed(1)+'" y2="'+P1.Y(b.low).toFixed(1)+'" stroke="'+c+'"/><rect x="'+(x-bw/2).toFixed(1)+'" y="'+Math.min(P1.Y(b.open),P1.Y(b.close)).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,Math.abs(P1.Y(b.open)-P1.Y(b.close))).toFixed(1)+'" fill="'+c+'"/>';});
  const line=(k,col)=>{let d="";B.forEach((b,i)=>{if(b[k]!=null)d+=(d?"L":"M")+X(i).toFixed(1)+" "+P1.Y(b[k]).toFixed(1);});return d?'<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.6"/>':'';};
  o+=line("ma20","#7a4e22")+line("ma50","#1c1916");
  o+='<text x="'+mg.l+'" y="248" font-size="10" fill="#5c564c">'+dm(B[0].date)+'</text><text x="'+(w-mg.r)+'" y="248" font-size="10" text-anchor="end" fill="#5c564c">'+dm(B[N-1].date)+'</text>';
  const vm=Math.max(...B.map(b=>b.volume))||1;o+='<g transform="translate(0,262)">';
  B.forEach((b,i)=>{const h=b.volume/vm*50;o+='<rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+(54-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+(b.close>=b.open?"#0f6a38":"#8e2e28")+'" opacity=".45"/>';});
  o+='<text x="'+(w-mg.r+4)+'" y="12" font-size="10" fill="#5c564c">KL</text></g>';
  const P2=panel(332,70,0,100,x=>x,[30,70]);o+=P2.g;let d="";B.forEach((b,i)=>{if(b.rsi!=null)d+=(d?"L":"M")+X(i).toFixed(1)+" "+P2.Y(b.rsi).toFixed(1);});o+='<path d="'+d+'" fill="none" stroke="#7a4e22" stroke-width="1.5"/><text x="'+mg.l+'" y="344" font-size="10" fill="#5c564c">RSI 14</text>';
  const mv=B.flatMap(b=>[b.macd,b.signal,b.hist]).filter(x=>x!=null),ml=Math.min(...mv,0),mh=Math.max(...mv,0),P3=panel(420,80,ml,mh,x=>nv(x,x>=100?0:2),[ml,0,mh].filter((x,i,a)=>a.indexOf(x)===i));o+=P3.g;
  B.forEach((b,i)=>{if(b.hist!=null){const y0=P3.Y(0),y1=P3.Y(b.hist);o+='<rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+Math.min(y0,y1).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(.5,Math.abs(y0-y1)).toFixed(1)+'" fill="'+(b.hist>=0?"#0f6a38":"#8e2e28")+'" opacity=".45"/>';}});
  [["macd","#1c1916"],["signal","#7a4e22"]].forEach(([k,c])=>{let d="";B.forEach((b,i)=>{if(b[k]!=null)d+=(d?"L":"M")+X(i).toFixed(1)+" "+P3.Y(b[k]).toFixed(1);});if(d)o+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="1.4"/>';});
  o+='<text x="'+mg.l+'" y="432" font-size="10" fill="#5c564c">MACD 12/26/9</text></svg>';return o;
}

  sh.innerHTML='<div class="mx-auto max-w-2xl space-y-4 safe-x py-4"><div class="flex items-center justify-between"><h1 class="text-lg font-semibold">Dữ liệu</h1><button type="button" data-act="closeSheet" class="'+BTN+'" id="shClose">Đóng</button></div>'+
   sec("Đang có",'<p class="text-sm">'+ws+' mã có báo cáo, '+ps+' mã có giá lịch sử'+(keys?', '+keys+' mã thêm tay trên máy này':'')+'.</p><div class="mt-2">'+stt+'</div>')+
   sec("Worker trung gian",'<p class="mb-2 text-xs text-muted">Cần để lấy giá gần thời gian thực và thêm mã mới ngay trong app. Dán địa chỉ Worker (https://...workers.dev).</p><div class="flex gap-2"><input id="wkUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://ten-ban.workers.dev" value="'+esc(wk())+'" class="min-w-0 flex-1 rounded-md border border-line bg-paper px-3 py-2 text-sm"/><button type="button" data-act="wkSave" class="'+BTN+'">Lưu</button></div>'+(wk()?'<button type="button" data-act="liveNow" class="mt-2 '+BTN+'">Lấy giá trực tiếp ngay</button>':''))+
   sec("Thêm mã",'<p class="mb-2 text-xs text-muted">Nhập một hoặc nhiều mã, cách nhau bằng dấu cách. Không có Worker thì CafeF thường bị trình duyệt chặn.</p><div class="flex gap-2"><input id="addT" type="text" autocomplete="off" autocapitalize="characters" placeholder="FPT HPG MWG" class="min-w-0 flex-1 rounded-md border border-line bg-paper px-3 py-2 text-sm uppercase"/><button type="button" data-act="addGo" class="rounded-md bg-ink px-4 py-2 text-sm font-medium text-paper">Lấy</button></div><button type="button" data-act="addVN30" class="mt-2 '+BTN+'">Nạp VN30</button>')+
   sec("Xóa",'<p class="mb-2 text-xs text-muted">Xóa các mã bạn đã thêm tay và cài đặt trên máy này. Dữ liệu từ repo không bị ảnh hưởng.</p><button type="button" data-act="wipe" class="rounded-md border border-down px-3 py-2 text-sm text-down">Xóa dữ liệu trên máy</button>')+'</div>';
  sh.classList.remove("hidden");document.body.style.overflow="hidden";$("shClose").focus();
}
function closeSheet(){$("sheet").classList.add("hidden");document.body.style.overflow="";}

/* =================== Sự kiện =================== */
const setF=(k,v)=>{D.F[k]=v;D.F.preset=matchPreset();saveDesk();};
function matchPreset(){const d=defaultFilters(),F=D.F;const base=k=>k!=="query"&&k!=="preset";
  for(const p of PRESETS){const e=Object.assign(defaultFilters(),p.patch);if(Object.keys(d).filter(base).every(k=>JSON.stringify(e[k])===JSON.stringify(F[k])))return p.id;}return"custom";}
document.addEventListener("click",e=>{
  const g=s=>e.target.closest(s);let x;
  if((x=g("[data-watch]"))){e.stopPropagation();const t=x.dataset.watch,i=D.watch.indexOf(t);if(i<0)D.watch.push(t);else D.watch.splice(i,1);saveDesk();if(D.step===1)renderRes();else renderView();return;}
  if((x=g("[data-pick]"))){D.sel=x.dataset.pick;go(2);return;}
  if((x=g("[data-step]"))){go(+x.dataset.step);return;}
  if((x=g("[data-preset]"))){const p=PRESETS.find(q=>q.id===x.dataset.preset),q=D.F.query;D.F=Object.assign(defaultFilters(),p.patch,{query:q,preset:p.id});saveDesk();viewScreen();return;}
  if((x=g("[data-clear]"))){const k=x.dataset.clear,d=defaultFilters();D.F[k]=d[k];D.F.preset=matchPreset();saveDesk();viewScreen();return;}
  if((x=g("[data-ex]"))){const a=D.F.exchanges,i=a.indexOf(x.dataset.ex);if(i<0)a.push(x.dataset.ex);else a.splice(i,1);D.more=true;setF("exchanges",a);viewScreen();return;}
  if((x=g("[data-sec]"))){const a=D.F.sectors,i=a.indexOf(x.dataset.sec);if(i<0)a.push(x.dataset.sec);else a.splice(i,1);D.more=true;setF("sectors",a);viewScreen();return;}
  if((x=g("[data-sort]"))){if(D.sortKey===x.dataset.sort)D.sortDir*=-1;else{D.sortKey=x.dataset.sort;D.sortDir=x.dataset.sort==="t"?1:-1;}saveDesk();renderRes();return;}
  if((x=g("[data-range]"))){D.range=x.dataset.range;saveDesk();viewTech();return;}
  if((x=g("[data-act]"))){const a=x.dataset.act;
    if(a==="settings")openSheet();else if(a==="closeSheet")closeSheet();
    else if(a==="resetF"){D.F=defaultFilters();saveDesk();viewScreen();}
    else if(a==="dir"){D.sortDir*=-1;saveDesk();renderRes();}
    else if(a==="wkSave"){const v=$("wkUrl").value.trim().replace(/\/+$/,"");if(v&&!/^https:\/\/[^\s]+$/i.test(v)){toast("Địa chỉ phải bắt đầu bằng https://");return;}if(v)lsSet("sang.worker",v);else lsDel("sang.worker");toast(v?"Đã lưu Worker":"Đã xóa Worker");openSheet();}
    else if(a==="liveNow"){toast("Đang lấy giá...");refreshLive(true).then(ok=>toast(ok?"Đã cập nhật giá":"Worker không trả giá, kiểm tra địa chỉ"));}
    else if(a==="addGo"){const L=$("addT").value.split(/[\s,;]+/).filter(Boolean);closeSheet();addMany(L);}
    else if(a==="addVN30"){closeSheet();addMany(VN30);}
    else if(a==="wipe"){lsDel("sang.user");USER={};FINS={};RAW={};PX={};closeSheet();loadFiles().then(()=>{loadUser();rebuild();renderAll();toast("Đã xóa dữ liệu thêm tay");});}
    return;}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("sheet").classList.contains("hidden"))closeSheet();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("tr[data-pick]")){e.preventDefault();D.sel=e.target.dataset.pick;go(2);}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="fq"){D.F.query=t.value;saveDesk();renderRes();}
  else if(t.id==="disc"){$("discV").textContent=t.value+"%";}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f){const n=t.value===""?null:Number(t.value);D.more=true;setF(t.dataset.f,n!=null&&isFinite(n)?n:null);viewScreen();}
  else if(t.dataset&&t.dataset.fb){D.more=true;setF(t.dataset.fb,t.checked);viewScreen();}
  else if(t.id==="sortSel"){D.sortKey=t.value;D.sortDir=t.value==="t"?1:-1;saveDesk();renderRes();}
  else if(t.id==="selT"){D.sel=t.value;saveDesk();renderView();}
  else if(t.id==="disc"){D.discount=Number(t.value)/100;saveDesk();viewValue();}
  else if(t.id==="gro"){const n=t.value===""?null:Number(t.value);D.growth=n!=null&&isFinite(n)?n:null;saveDesk();viewValue();}
});
document.addEventListener("toggle",e=>{const t=e.target;if(t.id==="more")D.more=t.open;else if(t.open&&t.querySelector){const r=t.querySelector(".rscroll");if(r)r.scrollLeft=r.scrollWidth;}},true);
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(D.step===3)viewTech();},200);});

/* =================== Khởi động =================== */
(async function boot(){
  loadDesk();loadUser();
  rebuild();renderAll();
  await loadFiles();loadUser();rebuild();
  if(D.sel&&!SMAP.has(D.sel))D.sel=null;if(D.step>1&&!D.sel)D.sel=defaultSel();
  renderAll();refreshLive();
  setInterval(()=>{if(!document.hidden)refreshLive();},20000);
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();

</script>
</body>
